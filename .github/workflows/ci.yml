name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:

# Batalkan run lama pada branch yang sama saat ada push baru.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `next build` (Turbopack) tidak menjalankan ESLint, jadi lint harus
      # menjadi gate tersendiri — tanpa ini error lint lolos ke branch.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /bff
          API_PROXY_TARGET: https://dev.api.temantumbuh.czn.my.id
